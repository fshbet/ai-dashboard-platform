version: "3.9"

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: ai-dash-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/data/dashboards.db
      - UPLOAD_DIR=/uploads
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/dashboard-gen
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - app_data:/data
      - app_uploads:/uploads
    depends_on:
      - n8n
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: ai-dash-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=changeme
      - WEBHOOK_URL=http://localhost:5678
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  app_data:
  app_uploads:
  n8n_data:
